<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The wordmark mark: two circles that overlap and neither gives way. Sized
       so it still reads as two at 16px, which is where a favicon actually lives. -->
  <rect width="32" height="32" rx="7" fill="#14171c"/>
  <circle cx="12.5" cy="16" r="7.5" fill="#c0403f"/>
  <circle cx="19.5" cy="16" r="7.5" fill="#2f6fc0" fill-opacity="0.92"/>
</svg>
